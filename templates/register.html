<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Budget Tracker</title>
  <link rel="icon" type="image/png" href="/static/icon.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Budget Tracker</h1>
    <h2>Create account</h2>

    {% if error %}
      <p class="alert alert-error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/register">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" required autofocus autocomplete="username"
             maxlength="64" />

      <label for="password">Password <span class="hint">(min 8 characters)</span></label>
      <input id="password" type="password" name="password" required autocomplete="new-password"
             minlength="8" />

      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" type="password" name="confirm_password" required
             autocomplete="new-password" minlength="8" />

      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
  </div>
</body>
</html>
